<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estacionamiento NFC</title>
  <link rel="manifest" href="./manifest.json">
</head>

<body>
  <h1>🚗 Estacionamiento NFC</h1>

  <div id="registroUsuario">
    <p>Selecciona quién usa este teléfono:</p>

    <select id="usuario">
      <option value="">Selecciona...</option>
      <option value="Felipe">Felipe</option>
      <option value="Vany">Vany</option>
      <option value="Mariana">Mariana</option>
    </select>

    <button onclick="guardarUsuario()">Guardar</button>
  </div>

  <p id="estado">Procesando...</p>

  <button onclick="cambiarUsuario()" style="margin-top:20px;">
    Cambiar usuario
  </button>

  <script>
    const ANTIREBOTE_MS = 30000;

    const BACKEND_URL =
      "https://script.google.com/macros/s/AKfycbyeLqJYUdKviFeCTLscWYk05RrDX6Z3lsXA0U6BbAz_j1S0GD0t6ch0KX-utOuHg5I1/exec";

    const CLAVE_PWA =
      "ESTACIONAMIENTO_NFC_2026_PWA";


    function obtenerLugar() {
      const params = new URLSearchParams(window.location.search);
      return params.get("lugar");
    }


    function obtenerUsuario() {
      return localStorage.getItem("usuarioEstacionamiento");
    }


    function guardarUsuario() {
      const usuario = document.getElementById("usuario").value;

      if (!usuario) {
        alert("Selecciona un usuario.");
        return;
      }

      localStorage.setItem(
        "usuarioEstacionamiento",
        usuario
      );

      document.getElementById("registroUsuario").style.display = "none";

      iniciar();
    }


    function cambiarUsuario() {
      localStorage.removeItem("usuarioEstacionamiento");
      localStorage.removeItem("ultimaLecturaNFC");

      const registro = document.getElementById("registroUsuario");
      const estado = document.getElementById("estado");

      document.getElementById("usuario").value = "";

      registro.style.display = "block";

      estado.textContent =
        "Selecciona nuevamente quién usa este teléfono.";
    }


    function obtenerPendientes() {
      return JSON.parse(
        localStorage.getItem("lecturasPendientes") || "[]"
      );
    }


    function guardarPendientes(pendientes) {
      localStorage.setItem(
        "lecturasPendientes",
        JSON.stringify(pendientes)
      );
    }


    function guardarLectura(lugar, usuario) {
      const ahora = Date.now();

      const ultimaLectura = JSON.parse(
        localStorage.getItem("ultimaLecturaNFC") || "null"
      );

      if (
        ultimaLectura &&
        ultimaLectura.lugar === lugar &&
        ultimaLectura.usuario === usuario &&
        ahora - ultimaLectura.timestamp < ANTIREBOTE_MS
      ) {
        return {
          aceptada: false,
          mensaje: "⏳ Lectura duplicada ignorada."
        };
      }

      const lectura = {
        id: crypto.randomUUID(),
        lugar: lugar,
        usuario: usuario,
        timestamp: ahora
      };

      const pendientes = obtenerPendientes();

      pendientes.push(lectura);

      guardarPendientes(pendientes);

      localStorage.setItem(
        "ultimaLecturaNFC",
        JSON.stringify({
          lugar: lugar,
          usuario: usuario,
          timestamp: ahora
        })
      );

      return {
        aceptada: true,
        mensaje: navigator.onLine
          ? "✅ Lectura registrada."
          : "📴 Sin conexión. Lectura guardada en el teléfono."
      };
    }


async function sincronizarPendientes() {
  if (!navigator.onLine) {
    return;
  }

  const pendientes = obtenerPendientes();

  if (pendientes.length === 0) {
    return;
  }

  const restantes = [];

  for (const lectura of pendientes) {
    try {
      // 1. Enviar lectura
      await fetch(BACKEND_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          clave: CLAVE_PWA,
          id: lectura.id,
          lugar: lectura.lugar,
          usuario: lectura.usuario,
          timestamp: lectura.timestamp
        })
      });

      // 2. Darle un momento al servidor para procesarla
      await new Promise(resolve => setTimeout(resolve, 1200));

      // 3. Consultar resultado real
      const consulta =
        BACKEND_URL +
        "?accion=estado&id=" +
        encodeURIComponent(lectura.id) +
        "&t=" +
        Date.now();

      const respuesta = await fetch(consulta, {
        method: "GET",
        cache: "no-store"
      });

      const datos = await respuesta.json();

      if (!datos.estado || datos.estado === "pendiente") {
        restantes.push(lectura);
        continue;
      }

      mostrarResultadoServidor(
        datos.estado,
        lectura
      );

    } catch (error) {
      restantes.push(lectura);
    }
  }

  guardarPendientes(restantes);

  if (restantes.length > 0) {
    document.getElementById("estado").textContent =
      "⏳ Hay " +
      restantes.length +
      " lectura(s) pendiente(s) de sincronizar.";
  }
}

    function mostrarResultadoServidor(estadoServidor, lectura) {
  const estado =
    document.getElementById("estado");

  switch (estadoServidor) {

    case "ocupado":
      estado.textContent =
        "🚗 " +
        lectura.lugar +
        " quedó ocupado por " +
        lectura.usuario +
        ".";
      break;

    case "liberado":
      estado.textContent =
        "✅ " +
        lectura.lugar +
        " quedó Libre.";
      break;

    case "ocupado_por_otro":
      estado.textContent =
        "⚠️ No se realizó el cambio. " +
        lectura.lugar +
        " está ocupado por otra persona.";
      break;

    case "usuario_en_otro_lugar":
      estado.textContent =
        "⚠️ No se realizó el cambio. " +
        lectura.usuario +
        " ya está registrado en otro lugar.";
      break;

    case "lectura_antigua":
      estado.textContent =
        "⏭️ Esta lectura no se aplicó porque ya hubo un cambio más reciente.";
      break;

    case "lugar_no_encontrado":
      estado.textContent =
        "❌ No se encontró el lugar " +
        lectura.lugar +
        ".";
      break;

    default:
      estado.textContent =
        "ℹ️ Lectura procesada: " +
        estadoServidor;
  }
}

    function iniciar() {
      const lugar = obtenerLugar();
      const usuario = obtenerUsuario();
      const estado = document.getElementById("estado");
      const registro = document.getElementById("registroUsuario");

      if (usuario) {
        registro.style.display = "none";
      } else {
        registro.style.display = "block";

        estado.textContent =
          "Primero registra este teléfono.";

        return;
      }

      if (!lugar) {
        estado.textContent =
          "❌ No se recibió ningún lugar.";

        sincronizarPendientes();
        return;
      }

      if (!["Adelante", "Medio", "Atrás"].includes(lugar)) {
        estado.textContent =
          "❌ Lugar NFC no válido.";

        return;
      }

      const resultado =
        guardarLectura(lugar, usuario);

      estado.textContent =
        resultado.mensaje +
        " Usuario: " +
        usuario +
        ". Lugar: " +
        lugar;

      if (resultado.aceptada) {
        sincronizarPendientes();
      }
    }


    window.addEventListener("online", () => {
      document.getElementById("estado").textContent =
        "📶 Conexión recuperada. Sincronizando...";

      sincronizarPendientes();
    });


    iniciar();


    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("./service-worker.js")
        .catch(error => {
          console.error(
            "Error registrando Service Worker:",
            error
          );
        });
    }
  </script>
</body>
</html>
