<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Estacionamiento NFC</title>

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>
</head>


<body>

  <h1>🚗 Estacionamiento NFC</h1>


  <!-- ===================================================
       INICIO DE SESIÓN GOOGLE
       =================================================== -->

  <div id="registroUsuario">

    <p>
      Inicia sesión con tu cuenta de Google:
    </p>

    <div
      id="g_id_onload"
      data-client_id="979392516075-ch3kg5n5fdbf9uco2ts2csr4motjfuqi.apps.googleusercontent.com"
      data-callback="manejarGoogleLogin"
      data-auto_prompt="false">
    </div>

    <div
      class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="signin_with"
      data-shape="rectangular"
      data-logo_alignment="left">
    </div>

  </div>


  <!-- ===================================================
       USUARIO AUTORIZADO
       =================================================== -->

  <p
    id="usuarioActual"
    style="display:none;">
  </p>


  <!-- ===================================================
       ESTADO
       =================================================== -->

  <p id="estado">
    Procesando...
  </p>


  <!-- ===================================================
       CAMBIAR CUENTA
       =================================================== -->

  <button
    id="botonCambiarUsuario"
    onclick="cambiarUsuario()"
    style="
      display:none;
      margin-top:20px;
    ">
    Cambiar usuario
  </button>



  <script>

    // =====================================================
    // CONFIGURACIÓN
    // =====================================================

    const ANTIREBOTE_MS =
      30000;


    const BACKEND_URL =
      "https://script.google.com/macros/s/AKfycbyeLqJYUdKviFeCTLscWYk05RrDX6Z3lsXA0U6BbAz_j1S0GD0t6ch0KX-utOuHg5I1/exec";


    const CLAVE_PWA =
      "ESTACIONAMIENTO_NFC_2026_PWA";



    // =====================================================
    // LUGAR NFC
    // =====================================================

    function obtenerLugar() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      return params.get("lugar");
    }



    // =====================================================
    // IDENTIDAD LOCAL VALIDADA
    // =====================================================

    function obtenerCorreo() {

      return localStorage.getItem(
        "correoGoogle"
      );
    }


    function obtenerUsuarioValidado() {

      return localStorage.getItem(
        "usuarioValidado"
      );
    }


    function obtenerDeviceToken() {

      return localStorage.getItem(
        "deviceToken"
      );
    }


    function sesionLista() {

      return Boolean(
        obtenerCorreo() &&
        obtenerUsuarioValidado() &&
        obtenerDeviceToken()
      );
    }



    // =====================================================
    // GOOGLE LOGIN
    // =====================================================

    async function manejarGoogleLogin(response) {

      try {

        mostrarEstado(
          "🔐 Validando tu cuenta..."
        );


        const registroId =
          crypto.randomUUID();


        // Enviar token firmado de Google a Apps Script
        await fetch(
          BACKEND_URL,
          {
            method: "POST",

            mode: "no-cors",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              clave:
                CLAVE_PWA,

              accion:
                "registrar_dispositivo",

              id:
                registroId,

              googleToken:
                response.credential

            })
          }
        );


        let resultado =
          null;


        // Consultar hasta que Apps Script termine
        for (
          let intento = 0;
          intento < 8;
          intento++
        ) {

          await esperar(
            700
          );


          const consulta =
            BACKEND_URL +
            "?accion=registro&id=" +
            encodeURIComponent(
              registroId
            ) +
            "&t=" +
            Date.now();


          const respuesta =
            await fetch(
              consulta,
              {
                method: "GET",
                cache: "no-store"
              }
            );


          const datos =
            await respuesta.json();


          if (
            datos.estado &&
            datos.estado !== "pendiente"
          ) {

            resultado =
              datos;

            break;
          }
        }


        // No hubo respuesta definitiva
        if (!resultado) {

          mostrarEstado(
            "⏳ No se pudo terminar la validación. Intenta nuevamente."
          );

          return;
        }


        // Cuenta no autorizada
        if (
          resultado.estado ===
          "usuario_no_autorizado"
        ) {

          limpiarSesionLocal();

          mostrarEstado(
            "⛔ Esta cuenta de Google no está autorizada para usar estos cajones."
          );

          return;
        }


        // Token de Google inválido
        if (
          resultado.estado ===
          "token_google_invalido"
        ) {

          limpiarSesionLocal();

          mostrarEstado(
            "🔐 No se pudo validar la cuenta de Google. Intenta iniciar sesión nuevamente."
          );

          return;
        }


        // Cualquier otro error
        if (
          !resultado.ok ||
          resultado.estado !== "autorizado" ||
          !resultado.deviceToken ||
          !resultado.usuario
        ) {

          limpiarSesionLocal();

          mostrarEstado(
            "❌ No se pudo autorizar este dispositivo."
          );

          return;
        }


        // Guardar únicamente identidad ya validada
        // por Google + Apps Script + hoja Usuarios

        localStorage.setItem(
          "correoGoogle",
          resultado.correo
        );


        localStorage.setItem(
          "usuarioValidado",
          resultado.usuario
        );


        localStorage.setItem(
          "deviceToken",
          resultado.deviceToken
        );


        mostrarSesion();


        mostrarEstado(
          "✅ Acceso autorizado. Usuario: " +
          resultado.usuario +
          "."
        );


        // Si el login ocurrió después de escanear una tag,
        // continuar automáticamente.
        iniciar();


      } catch (error) {

        console.error(
          "Error en Google Login:",
          error
        );


        mostrarEstado(
          "❌ No se pudo validar la cuenta. Revisa tu conexión."
        );
      }
    }



    // =====================================================
    // CAMBIAR USUARIO
    // =====================================================

    function cambiarUsuario() {

      limpiarSesionLocal();


      localStorage.removeItem(
        "ultimaLecturaNFC"
      );


      document
        .getElementById(
          "registroUsuario"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "usuarioActual"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "botonCambiarUsuario"
        )
        .style.display =
          "none";


      mostrarEstado(
        "Inicia sesión nuevamente con Google."
      );


      if (
        window.google &&
        google.accounts &&
        google.accounts.id
      ) {

        google.accounts.id
          .disableAutoSelect();
      }
    }


    function limpiarSesionLocal() {

      localStorage.removeItem(
        "correoGoogle"
      );

      localStorage.removeItem(
        "usuarioValidado"
      );

      localStorage.removeItem(
        "deviceToken"
      );
    }



    // =====================================================
    // MOSTRAR USUARIO
    // =====================================================

    function mostrarSesion() {

      const usuario =
        obtenerUsuarioValidado();


      const correo =
        obtenerCorreo();


      if (
        !usuario ||
        !correo
      ) {

        return;
      }


      document
        .getElementById(
          "registroUsuario"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "usuarioActual"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "usuarioActual"
        )
        .textContent =
          "Usuario: " +
          usuario +
          " · " +
          correo;


      document
        .getElementById(
          "botonCambiarUsuario"
        )
        .style.display =
          "inline-block";
    }



    // =====================================================
    // LECTURAS PENDIENTES
    // =====================================================

    function obtenerPendientes() {

      try {

        const pendientes =
          JSON.parse(
            localStorage.getItem(
              "lecturasPendientes"
            ) || "[]"
          );


        /*
        IMPORTANTE:

        Elimina automáticamente lecturas antiguas creadas
        antes de que existiera el sistema deviceToken.

        Así una lectura vieja no puede provocar después:
        "dispositivo no autorizado".
        */

        const validas =
          pendientes.filter(
            lectura =>
              lectura &&
              lectura.id &&
              lectura.lugar &&
              lectura.timestamp &&
              lectura.deviceToken
          );


        if (
          validas.length !==
          pendientes.length
        ) {

          localStorage.setItem(
            "lecturasPendientes",
            JSON.stringify(
              validas
            )
          );
        }


        return validas;


      } catch (error) {

        localStorage.setItem(
          "lecturasPendientes",
          "[]"
        );


        return [];
      }
    }


    function guardarPendientes(
      pendientes
    ) {

      localStorage.setItem(
        "lecturasPendientes",
        JSON.stringify(
          pendientes
        )
      );
    }



    // =====================================================
    // GUARDAR LECTURA LOCAL
    // =====================================================

    function guardarLectura(
      lugar
    ) {

      const usuario =
        obtenerUsuarioValidado();


      const correo =
        obtenerCorreo();


      const deviceToken =
        obtenerDeviceToken();


      if (
        !usuario ||
        !correo ||
        !deviceToken
      ) {

        return {

          aceptada:
            false,

          mensaje:
            "🔐 Primero inicia sesión con una cuenta autorizada."

        };
      }


      const ahora =
        Date.now();


      let ultimaLectura =
        null;


      try {

        ultimaLectura =
          JSON.parse(
            localStorage.getItem(
              "ultimaLecturaNFC"
            ) || "null"
          );


      } catch (error) {

        ultimaLectura =
          null;
      }


      // ---------------------------------------------
      // ANTI-REBOTE 30 SEGUNDOS
      // ---------------------------------------------

      if (
        ultimaLectura &&
        ultimaLectura.lugar ===
          lugar &&
        ultimaLectura.usuario ===
          usuario &&
        ahora -
          ultimaLectura.timestamp <
          ANTIREBOTE_MS
      ) {

        return {

          aceptada:
            false,

          mensaje:
            "⏳ Lectura duplicada ignorada. Usuario: " +
            usuario +
            "."

        };
      }


      // ---------------------------------------------
      // CREAR LECTURA
      // ---------------------------------------------

      const lectura = {

        id:
          crypto.randomUUID(),

        lugar:
          lugar,

        usuario:
          usuario,

        correo:
          correo,

        deviceToken:
          deviceToken,

        timestamp:
          ahora

      };


      const pendientes =
        obtenerPendientes();


      pendientes.push(
        lectura
      );


      guardarPendientes(
        pendientes
      );


      localStorage.setItem(
        "ultimaLecturaNFC",
        JSON.stringify({

          lugar:
            lugar,

          usuario:
            usuario,

          timestamp:
            ahora

        })
      );


      return {

        aceptada:
          true,

        mensaje:
          navigator.onLine

            ? "✅ Lectura registrada. Usuario: " +
              usuario +
              "."

            : "📴 Sin conexión. Lectura guardada en el teléfono. Usuario: " +
              usuario +
              "."

      };
    }



    // =====================================================
    // SINCRONIZAR
    // =====================================================

    async function sincronizarPendientes() {

      if (
        !navigator.onLine
      ) {

        return;
      }


      const pendientes =
        obtenerPendientes();


      if (
        pendientes.length === 0
      ) {

        return;
      }


      const restantes =
        [];


      for (
        const lectura of pendientes
      ) {

        try {

          // -----------------------------------------
          // ENVIAR LECTURA
          // -----------------------------------------

          await fetch(
            BACKEND_URL,
            {
              method:
                "POST",

              mode:
                "no-cors",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  clave:
                    CLAVE_PWA,

                  id:
                    lectura.id,

                  lugar:
                    lectura.lugar,

                  timestamp:
                    lectura.timestamp,

                  deviceToken:
                    lectura.deviceToken

                })
            }
          );


          let resultado =
            null;


          // -----------------------------------------
          // CONSULTAR RESULTADO REAL
          // -----------------------------------------

          for (
            let intento = 0;
            intento < 8;
            intento++
          ) {

            await esperar(
              700
            );


            const consulta =
              BACKEND_URL +
              "?accion=estado&id=" +
              encodeURIComponent(
                lectura.id
              ) +
              "&t=" +
              Date.now();


            const respuesta =
              await fetch(
                consulta,
                {
                  method:
                    "GET",

                  cache:
                    "no-store"
                }
              );


            const datos =
              await respuesta.json();


            if (
              datos.estado &&
              datos.estado !==
                "pendiente"
            ) {

              resultado =
                datos;

              break;
            }
          }


          // Servidor aún no respondió
          if (!resultado) {

            restantes.push(
              lectura
            );

            continue;
          }


          // Mostrar resultado final
          mostrarResultadoServidor(
            resultado,
            lectura
          );


        } catch (error) {

          console.error(
            "Error sincronizando:",
            error
          );


          restantes.push(
            lectura
          );
        }
      }


      guardarPendientes(
        restantes
      );


      if (
        restantes.length > 0
      ) {

        mostrarEstado(
          "⏳ Hay " +
          restantes.length +
          " lectura(s) pendiente(s) de sincronizar."
        );
      }
    }



    // =====================================================
    // RESULTADO DEL SERVIDOR
    // =====================================================

    function mostrarResultadoServidor(
      resultado,
      lectura
    ) {

      const usuario =
        resultado.usuario ||
        lectura.usuario ||
        "Usuario";


      switch (
        resultado.estado
      ) {


        // -------------------------------------------
        // OCUPADO
        // -------------------------------------------

        case "ocupado":

          mostrarEstado(
            "🚗 " +
            lectura.lugar +
            " quedó ocupado. Usuario: " +
            usuario +
            "."
          );

          break;


        // -------------------------------------------
        // LIBERADO
        // -------------------------------------------

        case "liberado":

          mostrarEstado(
            "✅ " +
            lectura.lugar +
            " quedó Libre. Usuario: " +
            usuario +
            "."
          );

          break;


        // -------------------------------------------
        // OCUPADO POR OTRA PERSONA
        // -------------------------------------------

        case "ocupado_por_otro":

          mostrarEstado(
            "⚠️ No se realizó el cambio. " +
            lectura.lugar +
            " está ocupado por " +
            (
              resultado.ocupante ||
              "otra persona"
            ) +
            ". Usuario que leyó la tag: " +
            usuario +
            "."
          );

          break;


        // -------------------------------------------
        // YA ESTACIONADO
        // -------------------------------------------

        case "usuario_en_otro_lugar":

          mostrarEstado(
            "⚠️ No se realizó el cambio. " +
            usuario +
            " ya está registrado en " +
            (
              resultado.lugarActual ||
              "otro lugar"
            ) +
            "."
          );

          break;


        // -------------------------------------------
        // LECTURA VIEJA
        // -------------------------------------------

        case "lectura_antigua":

          mostrarEstado(
            "⏭️ La lectura de " +
            usuario +
            " no se aplicó porque ya hubo un cambio más reciente."
          );

          break;


        // -------------------------------------------
        // USUARIO ELIMINADO DE SHEETS
        // -------------------------------------------

        case "usuario_no_autorizado":

          mostrarEstado(
            "⛔ Esta cuenta ya no está autorizada para usar los cajones."
          );

          break;


        // -------------------------------------------
        // DISPOSITIVO INVÁLIDO
        // -------------------------------------------

        case "dispositivo_no_autorizado":

          /*
          Solo llegamos aquí con una lectura NUEVA que sí
          tenía deviceToken.

          Las lecturas viejas sin deviceToken fueron
          eliminadas previamente por obtenerPendientes().
          */

          limpiarSesionLocal();


          localStorage.removeItem(
            "ultimaLecturaNFC"
          );


          document
            .getElementById(
              "registroUsuario"
            )
            .style.display =
              "block";


          document
            .getElementById(
              "usuarioActual"
            )
            .style.display =
              "none";


          document
            .getElementById(
              "botonCambiarUsuario"
            )
            .style.display =
              "none";


          mostrarEstado(
            "🔐 Este dispositivo necesita iniciar sesión nuevamente."
          );

          break;


        // -------------------------------------------
        // LUGAR NO ENCONTRADO
        // -------------------------------------------

        case "lugar_no_encontrado":

          mostrarEstado(
            "❌ No se encontró el lugar " +
            lectura.lugar +
            "."
          );

          break;


        // -------------------------------------------
        // TAG INVÁLIDA
        // -------------------------------------------

        case "lugar_no_valido":

          mostrarEstado(
            "❌ Tag NFC no válido."
          );

          break;


        // -------------------------------------------
        // ERROR
        // -------------------------------------------

        case "error":

          mostrarEstado(
            "❌ Ocurrió un error al procesar la lectura."
          );

          break;


        // -------------------------------------------
        // OTRO
        // -------------------------------------------

        default:

          mostrarEstado(
            "ℹ️ Resultado: " +
            resultado.estado
          );
      }
    }



    // =====================================================
    // INICIAR PWA
    // =====================================================

    function iniciar() {

      // Primero hacemos migración automática de
      // lecturas antiguas.
      obtenerPendientes();


      const lugar =
        obtenerLugar();


      // ---------------------------------------------
      // SIN SESIÓN
      // ---------------------------------------------

      if (
        !sesionLista()
      ) {

        document
          .getElementById(
            "registroUsuario"
          )
          .style.display =
            "block";


        document
          .getElementById(
            "usuarioActual"
          )
          .style.display =
            "none";


        document
          .getElementById(
            "botonCambiarUsuario"
          )
          .style.display =
            "none";


        mostrarEstado(
          "Inicia sesión con tu cuenta de Google."
        );


        return;
      }


      // ---------------------------------------------
      // SESIÓN EXISTENTE
      // ---------------------------------------------

      mostrarSesion();


      // ---------------------------------------------
      // PWA ABIERTA SIN NFC
      // ---------------------------------------------

      if (!lugar) {

        mostrarEstado(
          navigator.onLine

            ? "✅ Sesión lista. Usuario: " +
              obtenerUsuarioValidado() +
              "."

            : "📴 Aplicación disponible sin conexión. Usuario: " +
              obtenerUsuarioValidado() +
              "."
        );


        sincronizarPendientes();


        return;
      }


      // ---------------------------------------------
      // LUGAR INVÁLIDO
      // ---------------------------------------------

      if (
        ![
          "Adelante",
          "Medio",
          "Atrás"
        ].includes(
          lugar
        )
      ) {

        mostrarEstado(
          "❌ Lugar NFC no válido."
        );


        return;
      }


      // ---------------------------------------------
      // REGISTRAR ESCANEO
      // ---------------------------------------------

      const resultado =
        guardarLectura(
          lugar
        );


      mostrarEstado(
        resultado.mensaje +
        " Lugar: " +
        lugar +
        "."
      );


      if (
        resultado.aceptada
      ) {

        sincronizarPendientes();
      }
    }



    // =====================================================
    // RECUPERAR INTERNET
    // =====================================================

    window.addEventListener(
      "online",
      () => {

        mostrarEstado(
          "📶 Conexión recuperada. Sincronizando..."
        );


        sincronizarPendientes();
      }
    );



    // =====================================================
    // UTILIDADES
    // =====================================================

    function mostrarEstado(
      mensaje
    ) {

      document
        .getElementById(
          "estado"
        )
        .textContent =
          mensaje;
    }


    function esperar(ms) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            ms
          )
      );
    }



    // =====================================================
    // ARRANQUE
    // =====================================================

    iniciar();



    // =====================================================
    // SERVICE WORKER
    // =====================================================

    if (
      "serviceWorker" in navigator
    ) {

      navigator
        .serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(
          error => {

            console.error(
              "Error registrando Service Worker:",
              error
            );

          }
        );
    }

  </script>

</body>

</html>
