<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estacionamiento NFC</title>
  <link rel="manifest" href="./manifest.json">
</head>

<body>
  <h1>🚗 Estacionamiento NFC</h1>

  <div id="registroUsuario" style="display:none;">
    <p>Selecciona quién usa este teléfono:</p>

    <select id="usuario">
      <option value="">Selecciona...</option>
      <option value="Felipe">Felipe</option>
      <option value="Vany">Vany</option>
      <option value="Mariana">Mariana</option>
    </select>

    <button onclick="guardarUsuario()">Guardar</button>
  </div>

  <p id="estado">Procesando...</p>

  <script>
    const ANTIREBOTE_MS = 30000;

    function obtenerLugar() {
      const params = new URLSearchParams(window.location.search);
      return params.get("lugar");
    }

    function obtenerUsuario() {
      return localStorage.getItem("usuarioEstacionamiento");
    }

    function guardarUsuario() {
      const selector = document.getElementById("usuario");
      const usuario = selector.value;

      if (!usuario) {
        alert("Selecciona un usuario.");
        return;
      }

      localStorage.setItem("usuarioEstacionamiento", usuario);

      document.getElementById("registroUsuario").style.display = "none";

      iniciar();
    }

    function guardarLectura(lugar, usuario) {
      const ahora = Date.now();

      const ultimaLectura = JSON.parse(
        localStorage.getItem("ultimaLecturaNFC") || "null"
      );

      if (
        ultimaLectura &&
        ultimaLectura.lugar === lugar &&
        ultimaLectura.usuario === usuario &&
        ahora - ultimaLectura.timestamp < ANTIREBOTE_MS
      ) {
        return {
          aceptada: false,
          mensaje: "⏳ Lectura duplicada ignorada."
        };
      }

      const lectura = {
        id: crypto.randomUUID(),
        lugar: lugar,
        usuario: usuario,
        timestamp: ahora,
        sincronizado: false
      };

      const pendientes = JSON.parse(
        localStorage.getItem("lecturasPendientes") || "[]"
      );

      pendientes.push(lectura);

      localStorage.setItem(
        "lecturasPendientes",
        JSON.stringify(pendientes)
      );

      localStorage.setItem(
        "ultimaLecturaNFC",
        JSON.stringify({
          lugar: lugar,
          usuario: usuario,
          timestamp: ahora
        })
      );

      return {
        aceptada: true,
        mensaje: navigator.onLine
          ? "✅ Lectura registrada. Pendiente de sincronización."
          : "📴 Sin conexión. Lectura guardada en el teléfono."
      };
    }

    function iniciar() {
      const lugar = obtenerLugar();
      const usuario = obtenerUsuario();
      const estado = document.getElementById("estado");

      if (!usuario) {
        estado.textContent = "Primero registra este teléfono.";
        document.getElementById("registroUsuario").style.display = "block";
        return;
      }

      if (!lugar) {
        estado.textContent = "❌ No se recibió ningún lugar.";
        return;
      }

      if (!["Adelante", "Medio", "Atrás"].includes(lugar)) {
        estado.textContent = "❌ Lugar NFC no válido.";
        return;
      }

      const resultado = guardarLectura(lugar, usuario);

      estado.textContent =
        resultado.mensaje +
        " Usuario: " +
        usuario +
        ". Lugar: " +
        lugar;
    }

    iniciar();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js")
        .catch(error => {
          console.error("Error registrando Service Worker:", error);
        });
    }
  </script>
</body>
</html>
