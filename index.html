<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Estacionamiento NFC</title>

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>
</head>


<body>

  <h1>🚗 Estacionamiento NFC</h1>


  <!-- ===================================================
       INICIO DE SESIÓN GOOGLE
       =================================================== -->

  <div id="registroUsuario">

    <p>
      Inicia sesión con tu cuenta de Google:
    </p>

    <div
      id="g_id_onload"
      data-client_id="979392516075-ch3kg5n5fdbf9uco2ts2csr4motjfuqi.apps.googleusercontent.com"
      data-callback="manejarGoogleLogin"
      data-auto_prompt="false">
    </div>

    <div
      class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="signin_with"
      data-shape="rectangular"
      data-logo_alignment="left">
    </div>

  </div>


  <!-- ===================================================
       USUARIO AUTORIZADO
       =================================================== -->

  <p
    id="usuarioActual"
    style="display:none;">
  </p>


  <!-- ===================================================
       ESTADO
       =================================================== -->

  <p
    id="estado"
    style="white-space: pre-line;">
    Preparando...
  </p>


  <!-- ===================================================
       CAMBIAR CUENTA
       =================================================== -->

  <button
    id="botonCambiarUsuario"
    onclick="cambiarUsuario()"
    style="
      display:none;
      margin-top:20px;
    ">
    Cambiar usuario
  </button>



  <script>

    // =====================================================
    // CONFIGURACIÓN
    // =====================================================

    const ANTIREBOTE_MS =
      30000;


    const BACKEND_URL =
      "https://script.google.com/macros/s/AKfycbyeLqJYUdKviFeCTLscWYk05RrDX6Z3lsXA0U6BbAz_j1S0GD0t6ch0KX-utOuHg5I1/exec";


    const CLAVE_PWA =
      "ESTACIONAMIENTO_NFC_2026_PWA";



    // =====================================================
    // LUGAR NFC
    // =====================================================

    function obtenerLugar() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      return params.get("lugar");
    }



    // =====================================================
    // IDENTIDAD LOCAL VALIDADA
    // =====================================================

    function obtenerCorreo() {

      return localStorage.getItem(
        "correoGoogle"
      );
    }


    function obtenerUsuarioValidado() {

      return localStorage.getItem(
        "usuarioValidado"
      );
    }


    function obtenerDeviceToken() {

      return localStorage.getItem(
        "deviceToken"
      );
    }


    function sesionLista() {

      return Boolean(
        obtenerCorreo() &&
        obtenerUsuarioValidado() &&
        obtenerDeviceToken()
      );
    }



    // =====================================================
    // GOOGLE LOGIN
    // =====================================================

    async function manejarGoogleLogin(response) {

      try {

        mostrarEstado(
          "🔐 Verificando tu cuenta con Google..."
        );


        const registroId =
          crypto.randomUUID();


        await fetch(
          BACKEND_URL,
          {
            method: "POST",

            mode: "no-cors",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              clave:
                CLAVE_PWA,

              accion:
                "registrar_dispositivo",

              id:
                registroId,

              googleToken:
                response.credential

            })
          }
        );


        let resultado =
          null;


        for (
          let intento = 0;
          intento < 8;
          intento++
        ) {

          await esperar(
            700
          );


          const consulta =
            BACKEND_URL +
            "?accion=registro&id=" +
            encodeURIComponent(
              registroId
            ) +
            "&t=" +
            Date.now();


          const respuesta =
            await fetch(
              consulta,
              {
                method: "GET",
                cache: "no-store"
              }
            );


          const datos =
            await respuesta.json();


          if (
            datos.estado &&
            datos.estado !== "pendiente"
          ) {

            resultado =
              datos;

            break;
          }
        }


        if (!resultado) {

          mostrarEstado(
            "⏳ No recibimos confirmación todavía.\nIntenta iniciar sesión nuevamente."
          );

          return;
        }


        if (
          resultado.estado ===
          "usuario_no_autorizado"
        ) {

          limpiarSesionLocal();

          mostrarEstado(
            "⛔ Cuenta no autorizada.\nEste correo no está registrado para usar el estacionamiento."
          );

          return;
        }


        if (
          resultado.estado ===
          "token_google_invalido"
        ) {

          limpiarSesionLocal();

          mostrarEstado(
            "🔐 No pudimos validar la sesión de Google.\nIntenta iniciar sesión nuevamente."
          );

          return;
        }


        if (
          !resultado.ok ||
          resultado.estado !== "autorizado" ||
          !resultado.deviceToken ||
          !resultado.usuario
        ) {

          limpiarSesionLocal();

          mostrarEstado(
            "❌ No fue posible autorizar este dispositivo.\nIntenta nuevamente."
          );

          return;
        }


        // Guardar identidad validada

        localStorage.setItem(
          "correoGoogle",
          resultado.correo
        );


        localStorage.setItem(
          "usuarioValidado",
          resultado.usuario
        );


        localStorage.setItem(
          "deviceToken",
          resultado.deviceToken
        );


        mostrarSesion();


        mostrarEstado(
          "✅ Cuenta autorizada.\nUsuario: " +
          resultado.usuario
        );


        iniciar();


      } catch (error) {

        console.error(
          "Error en Google Login:",
          error
        );


        mostrarEstado(
          "❌ No pudimos verificar tu cuenta.\nRevisa tu conexión a internet e intenta nuevamente."
        );
      }
    }



    // =====================================================
    // CAMBIAR USUARIO
    // =====================================================

    function cambiarUsuario() {

      limpiarSesionLocal();


      localStorage.removeItem(
        "ultimaLecturaNFC"
      );


      document
        .getElementById(
          "registroUsuario"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "usuarioActual"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "botonCambiarUsuario"
        )
        .style.display =
          "none";


      mostrarEstado(
        "🔐 Selecciona la cuenta de Google que utilizará este teléfono."
      );


      if (
        window.google &&
        google.accounts &&
        google.accounts.id
      ) {

        google.accounts.id
          .disableAutoSelect();
      }
    }


    function limpiarSesionLocal() {

      localStorage.removeItem(
        "correoGoogle"
      );

      localStorage.removeItem(
        "usuarioValidado"
      );

      localStorage.removeItem(
        "deviceToken"
      );
    }



    // =====================================================
    // MOSTRAR USUARIO
    // =====================================================

    function mostrarSesion() {

      const usuario =
        obtenerUsuarioValidado();


      const correo =
        obtenerCorreo();


      if (
        !usuario ||
        !correo
      ) {

        return;
      }


      document
        .getElementById(
          "registroUsuario"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "usuarioActual"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "usuarioActual"
        )
        .textContent =
          "Usuario: " +
          usuario +
          " · " +
          correo;


      document
        .getElementById(
          "botonCambiarUsuario"
        )
        .style.display =
          "inline-block";
    }



    // =====================================================
    // LECTURAS PENDIENTES
    // =====================================================

    function obtenerPendientes() {

      try {

        const pendientes =
          JSON.parse(
            localStorage.getItem(
              "lecturasPendientes"
            ) || "[]"
          );


        // Eliminar lecturas antiguas de versiones previas
        // que no tienen deviceToken.

        const validas =
          pendientes.filter(
            lectura =>
              lectura &&
              lectura.id &&
              lectura.lugar &&
              lectura.timestamp &&
              lectura.deviceToken
          );


        if (
          validas.length !==
          pendientes.length
        ) {

          localStorage.setItem(
            "lecturasPendientes",
            JSON.stringify(
              validas
            )
          );
        }


        return validas;


      } catch (error) {

        localStorage.setItem(
          "lecturasPendientes",
          "[]"
        );


        return [];
      }
    }


    function guardarPendientes(
      pendientes
    ) {

      localStorage.setItem(
        "lecturasPendientes",
        JSON.stringify(
          pendientes
        )
      );
    }



    // =====================================================
    // GUARDAR LECTURA LOCAL
    // =====================================================

    function guardarLectura(
      lugar
    ) {

      const usuario =
        obtenerUsuarioValidado();


      const correo =
        obtenerCorreo();


      const deviceToken =
        obtenerDeviceToken();


      if (
        !usuario ||
        !correo ||
        !deviceToken
      ) {

        return {

          aceptada:
            false,

          mensaje:
            "🔐 Inicia sesión con una cuenta autorizada antes de usar el NFC."

        };
      }


      const ahora =
        Date.now();


      let ultimaLectura =
        null;


      try {

        ultimaLectura =
          JSON.parse(
            localStorage.getItem(
              "ultimaLecturaNFC"
            ) || "null"
          );


      } catch (error) {

        ultimaLectura =
          null;
      }


      // =================================================
      // ANTI-REBOTE 30 SEGUNDOS
      // =================================================

      if (
        ultimaLectura &&
        ultimaLectura.lugar ===
          lugar &&
        ultimaLectura.usuario ===
          usuario &&
        ahora -
          ultimaLectura.timestamp <
          ANTIREBOTE_MS
      ) {

        return {

          aceptada:
            false,

          mensaje:
            "⏳ Segunda lectura ignorada.\n" +
            "Espera 30 segundos antes de volver a usar este mismo NFC.\n" +
            "Usuario: " +
            usuario +
            "\nLugar: " +
            lugar

        };
      }


      // =================================================
      // CREAR LECTURA
      // =================================================

      const lectura = {

        id:
          crypto.randomUUID(),

        lugar:
          lugar,

        usuario:
          usuario,

        correo:
          correo,

        deviceToken:
          deviceToken,

        timestamp:
          ahora

      };


      const pendientes =
        obtenerPendientes();


      pendientes.push(
        lectura
      );


      guardarPendientes(
        pendientes
      );


      localStorage.setItem(
        "ultimaLecturaNFC",
        JSON.stringify({

          lugar:
            lugar,

          usuario:
            usuario,

          timestamp:
            ahora

        })
      );


      if (
        navigator.onLine
      ) {

        return {

          aceptada:
            true,

          mensaje:
            "⏳ Esperando confirmación...\n" +
            "Usuario: " +
            usuario +
            "\nLugar: " +
            lugar

        };

      }


      return {

        aceptada:
          true,

        mensaje:
          "📴 Sin conexión a internet.\n" +
          "El movimiento quedó guardado en este teléfono y se enviará cuando vuelva la conexión.\n" +
          "Usuario: " +
          usuario +
          "\nLugar: " +
          lugar

      };
    }



    // =====================================================
    // SINCRONIZAR
    // =====================================================

    async function sincronizarPendientes() {

      if (
        !navigator.onLine
      ) {

        return;
      }


      const pendientes =
        obtenerPendientes();


      if (
        pendientes.length === 0
      ) {

        return;
      }


      const restantes =
        [];


      for (
        const lectura of pendientes
      ) {

        try {

          // Si existe una operación pendiente,
          // informamos claramente qué estamos haciendo.

          mostrarEstado(
            "🔄 Sincronizando con el estacionamiento...\n" +
            "Usuario: " +
            lectura.usuario +
            "\nLugar: " +
            lectura.lugar
          );


          await fetch(
            BACKEND_URL,
            {
              method:
                "POST",

              mode:
                "no-cors",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  clave:
                    CLAVE_PWA,

                  id:
                    lectura.id,

                  lugar:
                    lectura.lugar,

                  timestamp:
                    lectura.timestamp,

                  deviceToken:
                    lectura.deviceToken

                })
            }
          );


          let resultado =
            null;


          // Consultar resultado real

          for (
            let intento = 0;
            intento < 8;
            intento++
          ) {

            await esperar(
              700
            );


            const consulta =
              BACKEND_URL +
              "?accion=estado&id=" +
              encodeURIComponent(
                lectura.id
              ) +
              "&t=" +
              Date.now();


            const respuesta =
              await fetch(
                consulta,
                {
                  method:
                    "GET",

                  cache:
                    "no-store"
                }
              );


            const datos =
              await respuesta.json();


            if (
              datos.estado &&
              datos.estado !==
                "pendiente"
            ) {

              resultado =
                datos;

              break;
            }
          }


          // Servidor aún no confirmó

          if (!resultado) {

            restantes.push(
              lectura
            );

            continue;
          }


          // Resultado confirmado

          mostrarResultadoServidor(
            resultado,
            lectura
          );


        } catch (error) {

          console.error(
            "Error sincronizando:",
            error
          );


          restantes.push(
            lectura
          );
        }
      }


      guardarPendientes(
        restantes
      );


      if (
        restantes.length > 0
      ) {

        mostrarEstado(
          "📴 No pudimos confirmar " +
          restantes.length +
          " movimiento(s).\n" +
          "Quedaron guardados y volveremos a intentarlo cuando haya conexión."
        );
      }
    }



    // =====================================================
    // RESULTADO CONFIRMADO POR EL SERVIDOR
    // =====================================================

    function mostrarResultadoServidor(
      resultado,
      lectura
    ) {

      const usuario =
        resultado.usuario ||
        lectura.usuario ||
        "Usuario";


      switch (
        resultado.estado
      ) {


        // =================================================
        // OCUPAR
        // =================================================

        case "ocupado":

          mostrarEstado(
            "✅ Movimiento confirmado.\n\n" +
            "🚗 " +
            lectura.lugar +
            " quedó ocupado.\n" +
            "Usuario: " +
            usuario
          );

          break;


        // =================================================
        // LIBERAR
        // =================================================

        case "liberado":

          mostrarEstado(
            "✅ Movimiento confirmado.\n\n" +
            "🅿️ " +
            lectura.lugar +
            " quedó Libre.\n" +
            "Usuario: " +
            usuario
          );

          break;


        // =================================================
        // OCUPADO POR OTRA PERSONA
        // =================================================

        case "ocupado_por_otro":

          mostrarEstado(
            "⚠️ No se hizo ningún cambio.\n\n" +
            lectura.lugar +
            " ya está ocupado por " +
            (
              resultado.ocupante ||
              "otra persona"
            ) +
            ".\n" +
            "Usuario que intentó registrar: " +
            usuario
          );

          break;


        // =================================================
        // USUARIO YA EN OTRO LUGAR
        // =================================================

        case "usuario_en_otro_lugar":

          mostrarEstado(
            "⚠️ No se hizo ningún cambio.\n\n" +
            usuario +
            " ya está registrado en " +
            (
              resultado.lugarActual ||
              "otro lugar"
            ) +
            "."
          );

          break;


        // =================================================
        // LECTURA ANTIGUA
        // =================================================

        case "lectura_antigua":

          mostrarEstado(
            "ℹ️ Movimiento descartado.\n\n" +
            "Ya hubo un cambio más reciente en " +
            lectura.lugar +
            ", por lo que esta operación pendiente no se aplicó.\n" +
            "Usuario: " +
            usuario
          );

          break;


        // =================================================
        // USUARIO YA NO AUTORIZADO
        // =================================================

        case "usuario_no_autorizado":

          mostrarEstado(
            "⛔ Movimiento rechazado.\n\n" +
            "Esta cuenta ya no está autorizada para usar el estacionamiento."
          );

          break;


        // =================================================
        // DISPOSITIVO NO AUTORIZADO
        // =================================================

        case "dispositivo_no_autorizado":

          limpiarSesionLocal();


          localStorage.removeItem(
            "ultimaLecturaNFC"
          );


          document
            .getElementById(
              "registroUsuario"
            )
            .style.display =
              "block";


          document
            .getElementById(
              "usuarioActual"
            )
            .style.display =
              "none";


          document
            .getElementById(
              "botonCambiarUsuario"
            )
            .style.display =
              "none";


          mostrarEstado(
            "🔐 Necesitamos volver a autorizar este teléfono.\nInicia sesión nuevamente con Google."
          );

          break;


        // =================================================
        // LUGAR NO ENCONTRADO
        // =================================================

        case "lugar_no_encontrado":

          mostrarEstado(
            "❌ No se realizó el movimiento.\n\n" +
            "No encontramos el lugar " +
            lectura.lugar +
            " en la tabla del estacionamiento."
          );

          break;


        // =================================================
        // TAG INVÁLIDA
        // =================================================

        case "lugar_no_valido":

          mostrarEstado(
            "❌ NFC no reconocido.\nEste tag no corresponde a un lugar válido."
          );

          break;


        // =================================================
        // ERROR
        // =================================================

        case "error":

          mostrarEstado(
            "❌ No pudimos completar el movimiento.\nEl registro quedó protegido para evitar un cambio incorrecto."
          );

          break;


        // =================================================
        // OTRO RESULTADO
        // =================================================

        default:

          mostrarEstado(
            "ℹ️ El servidor respondió: " +
            resultado.estado
          );
      }
    }



    // =====================================================
    // INICIAR PWA
    // =====================================================

    function iniciar() {

      // Limpiar automáticamente lecturas antiguas
      obtenerPendientes();


      const lugar =
        obtenerLugar();


      // =================================================
      // SIN SESIÓN
      // =================================================

      if (
        !sesionLista()
      ) {

        document
          .getElementById(
            "registroUsuario"
          )
          .style.display =
            "block";


        document
          .getElementById(
            "usuarioActual"
          )
          .style.display =
            "none";


        document
          .getElementById(
            "botonCambiarUsuario"
          )
          .style.display =
            "none";


        mostrarEstado(
          "🔐 Inicia sesión con una cuenta autorizada para usar el estacionamiento."
        );


        return;
      }


      // =================================================
      // SESIÓN EXISTENTE
      // =================================================

      mostrarSesion();


      // =================================================
      // PWA ABIERTA SIN NFC
      // =================================================

      if (!lugar) {

        mostrarEstado(
          navigator.onLine

            ? "✅ Sistema listo.\nUsuario: " +
              obtenerUsuarioValidado()

            : "📴 Sistema disponible sin conexión.\n" +
              "Los movimientos se guardarán en este teléfono hasta recuperar internet.\n" +
              "Usuario: " +
              obtenerUsuarioValidado()
        );


        sincronizarPendientes();


        return;
      }


      // =================================================
      // LUGAR INVÁLIDO
      // =================================================

      if (
        ![
          "Adelante",
          "Medio",
          "Atrás"
        ].includes(
          lugar
        )
      ) {

        mostrarEstado(
          "❌ Este NFC no corresponde a un lugar válido."
        );


        return;
      }


      // =================================================
      // REGISTRAR ESCANEO
      // =================================================

      const resultado =
        guardarLectura(
          lugar
        );


      mostrarEstado(
        resultado.mensaje
      );


      if (
        resultado.aceptada
      ) {

        sincronizarPendientes();
      }
    }



    // =====================================================
    // RECUPERAR INTERNET
    // =====================================================

    window.addEventListener(
      "online",
      () => {

        const pendientes =
          obtenerPendientes();


        if (
          pendientes.length > 0
        ) {

          mostrarEstado(
            "📶 Conexión recuperada.\nSincronizando " +
            pendientes.length +
            " movimiento(s) pendiente(s)..."
          );


          sincronizarPendientes();

        } else {

          mostrarEstado(
            "📶 Conexión recuperada.\nSistema listo.\nUsuario: " +
            obtenerUsuarioValidado()
          );
        }
      }
    );



    // =====================================================
    // UTILIDADES
    // =====================================================

    function mostrarEstado(
      mensaje
    ) {

      document
        .getElementById(
          "estado"
        )
        .textContent =
          mensaje;
    }


    function esperar(ms) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            ms
          )
      );
    }



    // =====================================================
    // ARRANQUE
    // =====================================================

    iniciar();



    // =====================================================
    // SERVICE WORKER
    // =====================================================

    if (
      "serviceWorker" in navigator
    ) {

      navigator
        .serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(
          error => {

            console.error(
              "Error registrando Service Worker:",
              error
            );

          }
        );
    }

  </script>

</body>

</html>
